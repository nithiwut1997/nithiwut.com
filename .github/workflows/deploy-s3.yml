name: Deploy static site to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-s3-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  NODE_VERSION: "20"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Verify static export output
        run: test -d out && test -f out/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-nithiwut-com
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy static export to S3
        run: |
          aws s3 sync out "s3://${S3_BUCKET}" \
            --delete \
            --only-show-errors \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Apply immutable cache to hashed Next assets
        run: |
          if [ -d out/_next/static ]; then
            aws s3 cp out/_next/static "s3://${S3_BUCKET}/_next/static" \
              --recursive \
              --only-show-errors \
              --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Deploy HTML to S3 with correct content type
        run: |
          aws s3 sync out "s3://${S3_BUCKET}" \
            --only-show-errors \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
